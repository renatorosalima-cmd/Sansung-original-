<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine Manual</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Viewfinder / Câmera */
        .camera-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Grid da Regra dos Terços */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .grid-box {
            border: 0.5px solid rgba(255, 255, 255, 0.12);
        }

        /* HUD Superior */
        .hud-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 10;
        }
        .app-title {
            color: #aaa;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 11px;
        }
        .rec-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff3b30;
            font-weight: bold;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Controles Manuais Inferiores */
        .controls-panel {
            background: #050505;
            padding: 20px 24px 28px 24px;
            border-top: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .control-label span.val {
            color: #ffffff;
            font-weight: 700;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            outline: none;
            accent-color: #ffffff;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        /* Botão de Gravação */
        .action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 6px;
        }
        .record-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .record-btn-inner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffffff;
            transition: all 0.2s ease;
        }
        .record-btn.recording {
            border-color: #ff3b30;
        }
        .record-btn.recording .record-btn-inner {
            border-radius: 6px;
            width: 22px;
            height: 22px;
            background: #ff3b30;
        }
    </style>
</head>
<body>

    <!-- Area da Câmera -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        
        <!-- Grid Regra dos Terços -->
        <div class="grid-overlay">
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
        </div>

        <!-- HUD Superior -->
        <div class="hud-top">
            <div class="app-title">CINE MANUAL</div>
            <div class="rec-indicator" id="recBadge" style="opacity: 0;">
                <div class="dot"></div> <span id="timerText">00:00</span>
            </div>
            <div>4K • 24FPS</div>
        </div>
    </div>

    <!-- Painel de Controles Manuais -->
    <div class="controls-panel">
        <!-- Controle ISO -->
        <div class="control-group">
            <div class="control-label">
                <span>ISO</span>
                <span class="val" id="isoVal">100</span>
            </div>
            <input type="range" id="isoSlider" min="100" max="3200" step="100" value="100">
        </div>

        <!-- Controle Shutter Speed -->
        <div class="control-group">
            <div class="control-label">
                <span>OBTURADOR (SHUTTER)</span>
                <span class="val" id="shutterVal">1/48 s</span>
            </div>
            <input type="range" id="shutterSlider" min="24" max="1000" step="1" value="48">
        </div>

        <!-- Controle de Foco -->
        <div class="control-group">
            <div class="control-label">
                <span>FOCO MANUAL</span>
                <span class="val" id="focusVal">50%</span>
            </div>
            <input type="range" id="focusSlider" min="0" max="100" step="1" value="50">
        </div>

        <!-- Botão de Ação -->
        <div class="action-bar">
            <button class="record-btn" id="recordBtn">
                <div class="record-btn-inner"></div>
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const isoSlider = document.getElementById('isoSlider');
        const isoVal = document.getElementById('isoVal');
        const shutterSlider = document.getElementById('shutterSlider');
        const shutterVal = document.getElementById('shutterVal');
        const focusSlider = document.getElementById('focusSlider');
        const focusVal = document.getElementById('focusVal');
        
        const recordBtn = document.getElementById('recordBtn');
        const recBadge = document.getElementById('recBadge');
        const timerText = document.getElementById('timerText');

        let isRecording = false;
        let mediaRecorder;
        let recordedChunks = [];
        let timerInterval;
        let secondsElapsed = 0;

        // Iniciar Câmera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: true
                });
                video.srcObject = stream;
                
                // Configurar gravador de mídia
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `cinemanual_take_${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                    recordedChunks = [];
                };

            } catch (err) {
                console.error("Erro ao acessar câmera/microfone: ", err);
                alert("Permissão de câmera e áudio necessária.");
            }
        }

        // Timer de Gravação
        function updateTimer() {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            timerText.textContent = `${mins}:${secs}`;
        }

        // Alternar Gravação
        recordBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;

            isRecording = !isRecording;
            if (isRecording) {
                recordedChunks = [];
                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recBadge.style.opacity = '1';
                secondsElapsed = 0;
                timerText.textContent = "00:00";
                timerInterval = setInterval(updateTimer, 1000);
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording');
                recBadge.style.opacity = '0';
                clearInterval(timerInterval);
            }
        });

        // Sliders de Ajuste
        isoSlider.addEventListener('input', (e) => {
            isoVal.textContent = e.target.value;
        });

        shutterSlider.addEventListener('input', (e) => {
            shutterVal.textContent = `1/${e.target.value} s`;
        });

        focusSlider.addEventListener('input', (e) => {
            focusVal.textContent = `${e.target.value}%`;
        });

        // Inicializar
        initCamera();
    </script>
</body>
</html>
