<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProCamera Web Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Viewfinder / Câmera */
        .camera-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Overlay da Câmera (Grid / OSD) */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .grid-box {
            border: 0.5px solid rgba(255, 255, 255, 0.15);
        }
        /* HUD Superior */
        .hud-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .rec-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff3b30;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Controles Manuais Inferiores */
        .controls-panel {
            background: rgba(10, 10, 10, 0.9);
            padding: 20px;
            border-top: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #aaa;
        }
        .control-label span.val {
            color: #00e5ff;
            font-weight: bold;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* Botão de Gravação */
        .action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 8px;
        }
        .record-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .record-btn-inner {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ff3b30;
            transition: all 0.2s ease;
        }
        .record-btn.recording .record-btn-inner {
            border-radius: 8px;
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>

    <!-- Area da Camera -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        
        <!-- Grid Regra dos Terços -->
        <div class="grid-overlay">
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
        </div>

        <!-- HUD Superior -->
        <div class="hud-top">
            <div class="rec-indicator" id="recBadge" style="opacity: 0;">
                <div class="dot"></div> REC
            </div>
            <div>4K UHD • 24 FPS</div>
            <div id="statusText">MANUAL</div>
        </div>
    </div>

    <!-- Controles Manuais -->
    <div class="controls-panel">
        <!-- Controle ISO -->
        <div class="control-group">
            <div class="control-label">
                <span>ISO (Sensibilidade)</span>
                <span class="val" id="isoVal">100</span>
            </div>
            <input type="range" id="isoSlider" min="100" max="3200" step="100" value="100">
        </div>

        <!-- Controle Shutter Speed -->
        <div class="control-group">
            <div class="control-label">
                <span>Velocidade Obturador</span>
                <span class="val" id="shutterVal">1/48 s</span>
            </div>
            <input type="range" id="shutterSlider" min="24" max="1000" step="1" value="48">
        </div>

        <!-- Botão de Ação -->
        <div class="action-bar">
            <button class="record-btn" id="recordBtn">
                <div class="record-btn-inner"></div>
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const isoSlider = document.getElementById('isoSlider');
        const isoVal = document.getElementById('isoVal');
        const shutterSlider = document.getElementById('shutterSlider');
        const shutterVal = document.getElementById('shutterVal');
        const recordBtn = document.getElementById('recordBtn');
        const recBadge = document.getElementById('recBadge');

        let isRecording = false;
        let videoTrack = null;

        // Iniciar Câmera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                // Tenta aplicar suporte manual nativo no navegador (onde suportado)
                applyAdvancedCameraSettings();
            } catch (err) {
                console.error("Erro ao acessar a câmera: ", err);
                alert("Não foi possível acessar a câmera. Verifique as permissões.");
            }
        }

        // Tenta aplicar suporte aos controles de hardware (disponível em navegadores Android/Chrome)
        async function applyAdvancedCameraSettings() {
            if (!videoTrack) return;
            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            
            // Verifica se a API do navegador dá suporte direto ao ISO
            if (capabilities.iso) {
                isoSlider.min = capabilities.iso.min;
                isoSlider.max = capabilities.iso.max;
                isoSlider.step = capabilities.iso.step;
            }
        }

        // Atualizar ISO
        isoSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            isoVal.textContent = val;
            
            if (videoTrack && videoTrack.applyConstraints) {
                videoTrack.applyConstraints({
                    advanced: [{ iso: val }]
                }).catch(() => {
                    // Fallback visual via CSS se o navegador não permitir ajuste de hardware direto
                    video.style.filter = `brightness(${val / 200})`
                });
            }
        });

        // Atualizar Shutter Speed
        shutterSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            shutterVal.textContent = `1/${val} s`;
            
            if (videoTrack && videoTrack.applyConstraints) {
                // Converte fração em segundos (ex: 1/48)
                const exposureTime = 1 / val; 
                videoTrack.applyConstraints({
                    advanced: [{ exposureTime: exposureTime }]
                }).catch(() => {});
            }
        });

        // Simular/Alternar Gravação
        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                recordBtn.classList.add('recording');
                recBadge.style.opacity = '1';
            } else {
                recordBtn.classList.remove('recording');
                recBadge.style.opacity = '0';
            }
        });

        // Inicializar
        initCamera();
    </script>
</body>
</html>
