<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover">

<meta name="theme-color"
content="#000000">

<title>Cine Manual Web V2.3</title>


<style>

*{
box-sizing:border-box;
}

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#000;

overflow:hidden;

font-family:Arial,sans-serif;

color:white;

}


#app{

position:fixed;

inset:0;

background:#000;

overflow:hidden;

}


/* =========================
   CÂMERA
========================= */

#preview{

position:absolute;

inset:0;

width:100%;
height:100%;

object-fit:cover;

object-position:center;

background:#000;

transform-origin:center;

transition:transform .12s;

}


/* =========================
   ÁREA DE TOQUE
========================= */

#touchArea{

position:absolute;

inset:0;

z-index:10;

pointer-events:auto;

}


/* =========================
   INDICADOR DE FOCO
========================= */

#focusBox{

position:absolute;

width:70px;

height:70px;

border:2px solid #fff;

border-radius:4px;

display:none;

pointer-events:none;

transform:
translate(-50%,-50%);

z-index:15;

box-shadow:
0 0 8px rgba(0,0,0,.7);

}


#focusBox.active{

display:block;

animation:
focusAnimation .45s ease;

}


@keyframes focusAnimation{

0%{

transform:
translate(-50%,-50%)
scale(1.25);

opacity:.4;

}

100%{

transform:
translate(-50%,-50%)
scale(1);

opacity:1;

}

}


/* =========================
   EXPOSIÇÃO VERTICAL
========================= */

#exposureIndicator{

position:absolute;

display:none;

width:3px;

height:100px;

background:#fff;

border-radius:3px;

z-index:16;

pointer-events:none;

}


#exposureIndicator::before{

content:"☀";

position:absolute;

left:50%;

top:-24px;

transform:
translateX(-50%);

font-size:17px;

}


/* =========================
   TOPO
========================= */

#topBar,
#bottomBar{

position:absolute;

left:0;

width:100%;

z-index:20;

display:flex;

align-items:center;

justify-content:center;

flex-wrap:wrap;

gap:6px;

background:
rgba(0,0,0,.65);

padding:7px;

}


#topBar{

top:0;

padding-top:
calc(
7px +
env(safe-area-inset-top)
);

}


#bottomBar{

bottom:0;

padding-bottom:
calc(
7px +
env(safe-area-inset-bottom)
);

}


/* =========================
   BOTÕES
========================= */

button,
select{

background:#151515;

color:#fff;

border:1px solid #666;

border-radius:8px;

padding:7px 9px;

font-size:12px;

}


button:active{

transform:scale(.96);

}


.rec{

border-color:#b00000;

}


/* =========================
   ZOOM
========================= */

#zoom{

width:110px;

}


.value{

min-width:45px;

text-align:center;

font-size:12px;

}


/* =========================
   REC
========================= */

#recDot{

display:inline-block;

width:10px;

height:10px;

border-radius:50%;

background:#777;

margin-right:5px;

}


.recording #recDot{

background:red;

box-shadow:
0 0 12px red;

}


#timer{

min-width:55px;

text-align:center;

font-weight:bold;

font-size:12px;

}


/* =========================
   STATUS
========================= */

#status{

width:100%;

text-align:center;

font-size:10px;

color:#ddd;

}


/* =========================
   GRADE
========================= */

#guides{

position:absolute;

inset:0;

z-index:5;

pointer-events:none;

}


.guide{

position:absolute;

background:
rgba(255,255,255,.35);

}


.v1{

left:33.333%;

top:0;

width:1px;

height:100%;

}


.v2{

left:66.666%;

top:0;

width:1px;

height:100%;

}


.h1{

top:33.333%;

left:0;

height:1px;

width:100%;

}


.h2{

top:66.666%;

left:0;

height:1px;

width:100%;

}


/* =========================
   CINEMA
========================= */

.letter{

position:absolute;

left:0;

width:100%;

background:#000;

z-index:8;

display:none;

pointer-events:none;

}


/* =========================
   MENSAGEM
========================= */

#message{

position:absolute;

z-index:40;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

background:
rgba(0,0,0,.65);

padding:15px 20px;

border-radius:10px;

text-align:center;

max-width:90%;

}


/* =========================
   PAINEL MANUAL
========================= */

#manualPanel{

position:absolute;

z-index:35;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

width:min(
360px,
90vw
);

background:
rgba(0,0,0,.90);

border:
1px solid #666;

border-radius:12px;

padding:14px;

display:none;

}


#manualPanel h3{

margin:0 0 12px;

text-align:center;

font-size:15px;

}


.control{

display:flex;

align-items:center;

gap:8px;

margin:10px 0;

}


.control label{

width:90px;

font-size:12px;

}


.control input,
.control select{

flex:1;

}


.manualInfo{

font-size:10px;

color:#aaa;

text-align:center;

margin-top:10px;

line-height:1.4;

}


/* =========================
   DICA
========================= */

#touchHint{

position:absolute;

z-index:30;

left:50%;

bottom:105px;

transform:
translateX(-50%);

background:
rgba(0,0,0,.55);

padding:6px 10px;

border-radius:8px;

font-size:10px;

display:none;

pointer-events:none;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

button,
select{

font-size:12px;

padding:7px 8px;

}

#zoom{

width:105px;

}

}

</style>

</head>


<body>


<div id="app">

id="preview"

autoplay

playsinline

muted>

<div id="touchArea">
</div>


<!-- INDICADOR DE FOCO -->

</div>

<div id="exposureIndicator">
</div>

<div id="guides">

<div class="guide v1"></div>

<div class="guide v2"></div>

<div class="guide h1"></div>

<div class="guide h2"></div>

id="bottomLetter"

<div id="manualPanel">


<h3>

<div class="control">

disabled>

Toque na tela para tentar focar.

Toque para focar • Arraste ↑↓ para exposição

📷 Abrir câmera

</button>

<select id="resolution">

1.0×

REC

</span>

<b>Abrir câmera</b>

<script>


/* =========================
   VARIÁVEIS
========================= */

let stream = null;

let videoTrack = null;

let capabilities = {};

let facingMode =
"environment";

let realZoom = false;

let recorder = null;

let recordedChunks = [];

let recording = false;

let recordingStart = 0;

let timerInterval = null;


/* TOQUE */

let touchStartX = 0;

let touchStartY = 0;

let touchStartTime = 0;

let touchStartExposure = 0;

let draggingExposure = false;



/* =========================
   $
========================= */

function $(id){

return document.getElementById(id);

}



/* =========================
   MENSAGEM
========================= */

function showMessage(text){

$("message").innerHTML =
text;

$("message").style.display =
text ? "block" : "none";

}



/* =========================
   STATUS
========================= */

function setStatus(text){

$("status").textContent =
text;

}



/* =========================
   PARAR CÂMERA
========================= */

function stopCamera(){

if(stream){

stream
.getTracks()
.forEach(
track => track.stop()
);

stream = null;

videoTrack = null;

}

}



/* =========================
   CONSTRAINTS
========================= */

function createConstraints(){


let video = {

facingMode:{
ideal:facingMode
}

};


let resolution =
$("resolution").value;


let fps =
$("fps").value;



if(
resolution !== "auto"
){

let parts =
resolution.split("x");


video.width = {

ideal:Number(parts[0])

};


video.height = {

ideal:Number(parts[1])

};

}



if(
fps !== "auto"
){

video.frameRate = {

ideal:Number(fps),

max:Number(fps)

};

}


return {

audio:true,

video:video

};

}



/* =========================
   ABRIR CÂMERA
========================= */

async function openCamera(){

stopCamera();


try{


stream =
await navigator
.mediaDevices
.getUserMedia(
createConstraints()
);


$("preview").srcObject =
stream;


await $("preview").play();


videoTrack =
stream
.getVideoTracks()[0];


capabilities =
videoTrack
.getCapabilities
?
videoTrack.getCapabilities()
:
{};


configureControls();


$("zoom").value = 1;

applyZoom();


const settings =
videoTrack.getSettings();


setStatus(

(settings.width || "?")
+
" × "
+
(settings.height || "?")
+
" • "
+
Math.round(
settings.frameRate || 0
)
+
" FPS"

);


updateCinema();


showMessage("");


/* DICA */

$("touchHint").style.display =
"block";


setTimeout(
function(){

$("touchHint")
.style
.display =
"none";

},
3500
);


}

catch(error){

console.error(error);


showMessage(

"Não foi possível abrir a câmera.<br><br>" +

"<small>" +

"Verifique a permissão da câmera " +

"e se o site está usando HTTPS."

+

"</small>"

);


setStatus(
error.name ||
"Erro"
);

}

}



/* =========================
   CAPACIDADES
========================= */

function configureControls(){


/* ZOOM */

if(
capabilities.zoom
){

realZoom = true;


$("zoom").min =
capabilities.zoom.min || 1;


$("zoom").max =
Math.min(
capabilities.zoom.max || 4,
8
);


$("zoom").step =
capabilities.zoom.step || .1;

}

else{

realZoom = false;


$("zoom").min = 1;

$("zoom").max = 4;

$("zoom").step = .1;

}



/* EXPOSIÇÃO */

let exposure =
capabilities.exposureCompensation;


if(exposure){

$("exposure").disabled =
false;


$("exposure").min =
exposure.min;


$("exposure").max =
exposure.max;


$("exposure").step =
exposure.step || .1;


$("exposure").value = 0;

}

else{

$("exposure").disabled =
true;

}



/* FOCO */

let focusModes =
capabilities.focusMode;


$("focusMode").innerHTML =
"";


if(
Array.isArray(focusModes)
&&
focusModes.length
){

$("focusMode").disabled =
false;


focusModes.forEach(
mode => {


let option =
document.createElement(
"option"
);


option.value =
mode;


if(
mode ===
"continuous"
){

option.textContent =
"Contínuo";

}

else if(
mode ===
"single-shot"
){

option.textContent =
"Toque";

}

else if(
mode ===
"manual"
){

option.textContent =
"Manual";

}

else{

option.textContent =
mode;

}


$("focusMode")
.appendChild(
option
);

}

);

}

else{

$("focusMode").disabled =
true;


$("focusMode").innerHTML =
"<option>Não disponível</option>";

}



/* WHITE BALANCE */

let wb =
capabilities.whiteBalanceMode;


$("whiteBalance").innerHTML =
"";


if(
Array.isArray(wb)
&&
wb.length
){

$("whiteBalance").disabled =
false;


wb.forEach(
mode => {


let option =
document.createElement(
"option"
);


option.value =
mode;


option.textContent =
mode;


$("whiteBalance")
.appendChild(
option
);

}

);

}

else{

$("whiteBalance").disabled =
true;


$("whiteBalance").innerHTML =
"<option>Não disponível</option>";

}

}



/* =========================
   ZOOM
========================= */

async function applyZoom(){


let value =
Number(
$("zoom").value
);


$("zoomValue").textContent =

value.toFixed(1)
+
"×";


if(
videoTrack
&&
realZoom
){

try{


await videoTrack
.applyConstraints({

advanced:[
{
zoom:value
}
]

});


$("preview")
.style
.transform =
"scale(1)";


return;


}

catch(error){

console.log(error);

}

}


$("preview")
.style
.transform =

"scale("
+
value
+
")";

}



/* =========================
   CONTROLES MANUAIS
========================= */

async function applyManualControls(){


if(!videoTrack){

return;

}


let settings = {};



if(
!$("exposure").disabled
){

settings.exposureCompensation =
Number(
$("exposure").value
);

}



if(
!$("focusMode").disabled
){

settings.focusMode =
$("focusMode").value;

}



if(
!$("whiteBalance").disabled
){

settings.whiteBalanceMode =
$("whiteBalance").value;

}



if(
Object.keys(settings).length === 0
){

setStatus(
"Controle manual não disponível"
);

return;

}



try{


await videoTrack
.applyConstraints({

advanced:[
settings
]

});


setStatus(
"Controle aplicado"
);


}

catch(error){

console.log(error);


setStatus(
"Controle não suportado"
);

}

}



/* =========================
   FOCO POR TOQUE
========================= */

async function focusAtPoint(
x,
y
){


/*
A API padrão do navegador
não possui um comando universal
de foco por coordenada.

Aqui usamos o modo de foco
disponível como melhor aproximação.
*/


if(
videoTrack
&&
!$("focusMode").disabled
){


let modes =
capabilities.focusMode || [];


try{


if(
modes.includes(
"single-shot"
)
){

await videoTrack
.applyConstraints({

advanced:[
{
focusMode:
"single-shot"
}
]

});


setStatus(
"Foco por toque"
);

}

else if(
modes.includes(
"continuous"
)
){

await videoTrack
.applyConstraints({

advanced:[
{
focusMode:
"continuous"
}
]

});


setStatus(
"Foco contínuo"
);

}

else{

setStatus(
"Foco manual não disponível"
);

}


}

catch(error){

setStatus(
"Foco não suportado"
);

}

}

else{

setStatus(
"Foco por toque não disponível"
);

}

}



/* =========================
   INDICADOR
========================= */

function showFocusBox(
x,
y
){


let box =
$("focusBox");


box.style.left =
x + "px";


box.style.top =
y + "px";


box.classList.remove(
"active"
);


/* força nova animação */

void box.offsetWidth;


box.classList.add(
"active"
);


setTimeout(
function(){

box.classList.remove(
"active"
);

},
900
);

}



/* =========================
   TOQUE
========================= */

$("touchArea")
.addEventListener(
"pointerdown",
function(event){


if(
!videoTrack
){

return;

}


/*
Não interceptar controles
da interface.
*/

if(
event.target !==
$("touchArea")
){

return;

}


touchStartX =
event.clientX;


touchStartY =
event.clientY;


touchStartTime =
Date.now();


touchStartExposure =
Number(
$("exposure").value
);


draggingExposure = false;

});



$("touchArea")
.addEventListener(
"pointermove",
function(event){


if(
!videoTrack
){

return;

}


let dy =
event.clientY
-
touchStartY;


if(
Math.abs(dy) > 12
){

draggingExposure = true;


/*
Arrastar para cima
aumenta exposição.

Arrastar para baixo
diminui.
*/


let range =
Number(
$("exposure").max
)
-
Number(
$("exposure").min
);


let sensitivity =
range /
250;


let value =

touchStartExposure
-
(dy * sensitivity);


value =
Math.max(
Number(
$("exposure").min
),
Math.min(
Number(
$("exposure").max
),
value
)
;


if(
!$("exposure").disabled
){

$("exposure").value =
value;


$("exposureValue")
.textContent =
value.toFixed(1);


applyManualControls();


$("exposureIndicator")
.style
.display =
"block";


$("exposureIndicator")
.style
.left =
event.clientX + "px";


$("exposureIndicator")
.style
.top =
event.clientY + "px";

}

}

});



$("touchArea")
.addEventListener(
"pointerup",
function(event){


if(
!videoTrack
){

return;

}


/*
Se não arrastou,
é um toque para foco.
*/

if(
!draggingExposure
){

focusAtPoint(
event.clientX,
event.clientY
);


showFocusBox(
event.clientX,
event.clientY
);

}


setTimeout(
function(){

$("exposureIndicator")
.style
.display =
"none";

},
700
);

});



/* =========================
   BOTÕES
========================= */

$("openCamera")
.onclick =
openCamera;



$("flipCamera")
.onclick =
function(){

facingMode =
facingMode ===
"environment"

?

"user"

:

"environment";


openCamera();

};



$("zoom")
.oninput =
applyZoom;



$("exposure")
.oninput =
function(){

$("exposureValue")
.textContent =
Number(
$("exposure").value
)
.toFixed(1);


applyManualControls();

};



$("focusMode")
.onchange =
applyManualControls;



$("whiteBalance")
.onchange =
applyManualControls;



/* =========================
   PAINEL MANUAL
========================= */

$("manualButton")
.onclick =
function(){

let panel =
$("manualPanel");


let visible =
panel.style.display ===
"block";


panel.style.display =
visible
?
"none"
:
"block";


this.textContent =
visible
?
"🎛️ Manual"
:
"🎛️ Fechar";

};



/* =========================
   GRADE
========================= */

$("gridButton")
.onclick =
function(){

let guides =
$("guides");


let visible =
guides.style.display !==
"none";


guides.style.display =
visible
?
"none"
:
"block";


this.textContent =
visible
?
"Grade OFF"
:
"Grade ON";

};



/* =========================
   CINEMA
========================= */

function updateCinema(){


let mode =
$("aspect").value;


let top =
$("topLetter");


let bottom =
$("bottomLetter");


if(
mode ===
"normal"
){

top.style.display =
"none";

bottom.style.display =
"none";

return;

}


let ratio =
Number(mode);


let desiredHeight =
window.innerWidth /
ratio;


let bars =

(
window.innerHeight
-
desiredHeight
) / 2;


if(
bars > 0
){

top.style.display =
"block";

bottom.style.display =
"block";


top.style.height =
bars + "px";


bottom.style.height =
bars + "px";


top.style.top =
"0";


bottom.style.bottom =
"0";

}

else{

top.style.display =
"none";

bottom.style.display =
"none";

}

}



$("aspect")
.onchange =
updateCinema;


window
.addEventListener(
"resize",
updateCinema
);



/* =========================
   GRAVAÇÃO
========================= */

function getMimeType(){


let formats = [

"video/mp4;codecs=avc1.42E01E,mp4a.40.2",

"video/mp4",

"video/webm;codecs=vp9,opus",

"video/webm"

];


for(
let format
of formats
){

if(
MediaRecorder
.isTypeSupported(
format
)
){

return format;

}

}


return "";

}



/* =========================
   REC
========================= */

$("recordButton")
.onclick =
function(){

if(!stream){

showMessage(
"Primeiro abra a câmera."
);

return;

}


if(recording){

stopRecording();

}

else{

startRecording();

}

};



function startRecording(){


let mime =
getMimeType();


if(!mime){

showMessage(
"Formato de gravação não suportado."
);

return;

}


try{


recorder =
new MediaRecorder(

stream,

{

mimeType:mime,

videoBitsPerSecond:
20000000

}

);


}

catch(error){

recorder =
new MediaRecorder(
stream
);

}


recordedChunks = [];


recorder
.ondataavailable =
function(event){

if(
event.data.size
){

recordedChunks
.push(
event.data
);

}

};



recorder
.onstop =
saveRecording;


recorder.start(1000);


recording = true;


document.body
.classList
.add(
"recording"
);


$("recordText")
.textContent =
"PARAR";


recordingStart =
Date.now();


timerInterval =
setInterval(
updateTimer,
250
);


setStatus(
"🔴 Gravando"
);

}



/* =========================
   TIMER
========================= */

function updateTimer(){


let seconds =

Math.floor(

(
Date.now()
-
recordingStart
)
/
1000

);


let minutes =

Math.floor(
seconds / 60
);


seconds =
seconds % 60;


$("timer")
.textContent =

String(minutes)
.padStart(
2,
"0"
)

+

":"

+

String(seconds)
.padStart(
2,
"0"
);

}



/* =========================
   PARAR
========================= */

function stopRecording(){


if(
recorder
&&
recording
){

recorder.stop();

}


recording = false;


document.body
.classList
.remove(
"recording"
);


$("recordText")
.textContent =
"REC";


clearInterval(
timerInterval
);


setStatus(
"Processando vídeo..."
);

}



/* =========================
   SALVAR
========================= */

function saveRecording(){


let type =
recorder.mimeType
||
"video/webm";


let blob =
new Blob(

recordedChunks,

{

type:type

}

);


let url =
URL.createObjectURL(
blob
);


let link =
document.createElement(
"a"
);


link.href =
url;


link.download =

"CINE_"

+

new Date()
.toISOString()
.replace(
/[:.]/g,
"-"
)

+

"."

+

(
type.includes("mp4")
?
"mp4"
:
"webm"
);


link.click();


setTimeout(
function(){

URL.revokeObjectURL(
url
);

},
3000
);


setStatus(
"Vídeo salvo"
);

}



/* =========================
   INICIALIZAÇÃO
========================= */

updateCinema();

</script>

</body>

</html>
